plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.ghostyx.protonlocationpicker'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.ghostyx.protonlocationpicker'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation 'com.wireguard.android:tunnel:1.0.20251231'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
